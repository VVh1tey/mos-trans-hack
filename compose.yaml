name: mos-trans-online

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transport
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transport_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U transport -d transport"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-init:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transport_local}
    volumes:
      - ./infra/postgres/init.sh:/init.sh:ro
    entrypoint: [sh, /init.sh]
    depends_on:
      postgres: {condition: service_healthy}

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  ml:
    build:
      context: ./ml
    environment:
      RUNS_DIR: /runs
    volumes:
      - ./runs:/runs:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      ML_URL: http://ml:8001
      ROUTES_IMPORT_DIR: /app/import/routes
      EMULATOR_URL: http://emulator:18080
      INGEST_URL: http://ingest:9101
      NDTP_TARGET_HOST: ingest
      DATASET_DIR: /dataset
    volumes:
      - ./data/moscowmap:/app/import/routes:ro
      - ./dataset/test:/dataset/test:ro
      - ./dataset/labels/labels_test.csv:/dataset/labels/labels_test.csv:ro
    ports:
      - '127.0.0.1:${BACKEND_PORT:-18000}:8000'
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      ml: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingest:
    build:
      context: ./backend
    command: [python, ingest.py]
    environment:
      ROLE: ingest
      HEALTH_PORT: '9101'
    ports:
      - '127.0.0.1:${NDTP_PORT:-9201}:9201'
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  feature-worker:
    build:
      context: ./backend
    command: [python, scaffold.py]
    environment:
      ROLE: feature-worker
      HEALTH_PORT: '9102'
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  scheduler:
    build:
      context: ./backend
    command: [python, scaffold.py]
    environment:
      ROLE: scheduler
      HEALTH_PORT: '9103'
      ML_URL: http://ml:8001
    depends_on:
      feature-worker: {condition: service_healthy}
      ml: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9103/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  archive-worker:
    build:
      context: ./backend
    command: [python, scaffold.py]
    environment:
      ROLE: archive-worker
      HEALTH_PORT: '9104'
    volumes:
      - ./data:/archive
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9104/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-19090}:9090'
    depends_on:
      backend: {condition: service_healthy}
      ml: {condition: service_healthy}
      ingest: {condition: service_healthy}
      feature-worker: {condition: service_healthy}
      archive-worker: {condition: service_healthy}
      scheduler: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transport_local}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infra/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-13000}:3000'
    depends_on:
      prometheus: {condition: service_healthy}
      db-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 5s
      retries: 15

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-18080}:80'
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 5s
      timeout: 3s
      retries: 10

  emulator:
    profiles: [emulator]
    image: ndtp-telemetry-emulator:1.0
    ports:
      - '127.0.0.1:${EMULATOR_PORT:-18081}:18080'
    depends_on:
      ingest: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
