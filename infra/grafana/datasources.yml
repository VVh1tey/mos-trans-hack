apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: PostgreSQL
    uid: transport-db
    type: postgres
    access: proxy
    url: postgres:5432
    user: transport
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: transport
      sslmode: disable
      postgresVersion: 1600
